<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF4EA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="작심 삼달">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><g fill='%23DE6FA1'><circle cx='12.00' cy='6.70' r='4.7'/><circle cx='17.04' cy='10.36' r='4.7'/><circle cx='15.12' cy='16.29' r='4.7'/><circle cx='8.88' cy='16.29' r='4.7'/><circle cx='6.96' cy='10.36' r='4.7'/></g><circle cx='12' cy='12' r='3.1' fill='%23FFFCF7'/></svg>">
<link rel="icon" type="image/png" sizes="512x512" href="icon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>작심 삼달 영어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --cream:#FBF4EA; --paper:#FFFCF7; --linen:#F3EADF; --line:#EADFD3;
  --pink:#EFA9C9; --pink-deep:#DE6FA1; --blush:#F8D9E6; --blush-2:#FCEAF2;
  --cocoa:#8A6656; --cocoa-deep:#6E4F43; --cocoa-soft:#E9DCD3;
  --stone:#C9C2B8; --stone-soft:#ECE6DD;
  --ink:#4A332E; --sub:#8C776F; --faint:#B9AAA2;
  --rasp:#C9466B; --rasp-soft:#FBE3EA;
  --jh:var(--pink-deep); --jh-soft:var(--blush); --yn:var(--cocoa); --yn-soft:var(--cocoa-soft);
  --me:var(--jh); --me-soft:var(--jh-soft);
  --en:"Jost","Futura","Century Gothic",sans-serif;
  --ko:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --spring:cubic-bezier(.34,1.56,.64,1);
  --ease:cubic-bezier(.22,.8,.26,1);
}
body.me-yena{--me:var(--yn); --me-soft:var(--yn-soft)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:var(--ko);background:var(--cream);color:var(--ink);font-size:15px;line-height:1.55;letter-spacing:-0.01em;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--me);outline-offset:3px;border-radius:8px}
.en{font-family:var(--en);letter-spacing:0}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- ticket motif ---------- */
.ticket{position:relative;border-radius:22px;background:var(--t,var(--paper));
  --ticket-mask:radial-gradient(circle 9px at 0 var(--notch-y,50%),#0000 96%,#000 100%),radial-gradient(circle 9px at 100% var(--notch-y,50%),#0000 96%,#000 100%),radial-gradient(circle 7px at 50% 0,#0000 96%,#000 100%);
  -webkit-mask:var(--ticket-mask);mask:var(--ticket-mask);-webkit-mask-composite:source-in;mask-composite:intersect}
.ticket .hole{display:none}
.lift{filter:drop-shadow(0 12px 22px rgba(74,51,46,.22))}
.paren{font-family:var(--en);font-size:13px;font-weight:500;letter-spacing:.01em;color:var(--sub)}
.chips-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:99px;background:rgba(74,51,46,.07);font-family:var(--en);font-size:12px;font-weight:500;letter-spacing:.01em;color:var(--sub);white-space:nowrap}
.chip.on-pink{background:rgba(255,252,247,.5);color:var(--cocoa-deep)}
.chip.on-dark{background:rgba(255,255,255,.16);color:var(--pink)}

/* ---------- header / nav ---------- */
.top{position:sticky;top:0;z-index:30;background:rgba(251,244,234,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.top-in{max-width:1120px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:16px}
.brand{display:flex;flex-direction:column;line-height:1.05}
.brand .en{font-size:21px;font-weight:600;letter-spacing:-.01em}
.brand .en i{font-style:normal;color:var(--pink-deep)}
.brand small{font-size:11px;color:var(--sub);margin-top:3px;letter-spacing:.02em}
.who{margin-left:auto;display:flex;gap:6px}
.who button{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px 0 4px;border-radius:99px;font-size:13px;font-weight:600;color:var(--sub);transition:background .2s,color .2s}
.who button .sw{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;transition:transform .3s var(--spring)}
.who button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.who button[aria-pressed="true"] .sw{transform:rotate(72deg)}
nav.tabs{display:flex;gap:4px;background:var(--ink);padding:5px;border-radius:99px}
nav.tabs button{position:relative;height:38px;padding:0 16px;border-radius:99px;color:#F3E6DE;display:flex;align-items:center;gap:6px;transition:color .2s}
nav.tabs button .en{font-size:15px;font-weight:500}
nav.tabs button small{font-size:11px;opacity:.7}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs .pill{position:absolute;top:5px;bottom:5px;left:5px;width:0;border-radius:99px;background:var(--pink);z-index:-1;transition:transform .45s var(--ease),width .45s var(--ease)}
nav.tabs{position:relative;isolation:isolate}
nav.tabs .badge{position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--rasp);box-shadow:0 0 0 2px var(--ink)}
.nav-wrap{display:flex;justify-content:center}
@media (min-width:821px){.nav-wrap{position:fixed;top:13px;left:50%;transform:translateX(-50%);z-index:31}}
@media (max-width:820px){
  .nav-wrap{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));z-index:40;pointer-events:none}
  nav.tabs{pointer-events:auto;box-shadow:0 10px 30px rgba(74,51,46,.25)}
  nav.tabs button{padding:0 13px;flex-direction:column;gap:0;justify-content:center;height:46px}
  nav.tabs button .en{font-size:14px;line-height:1.1}
  nav.tabs button small{font-size:10px}
  .top-in{padding:12px 18px}
  .who button{padding:0 4px;font-size:0;gap:0}
  .who button[aria-pressed="true"]{padding:0 10px 0 4px;font-size:12.5px;gap:6px}
}

.demo{max-width:1120px;margin:0 auto;padding:0 24px}
.demo details{background:var(--linen);border-radius:14px;font-size:12.5px;color:var(--sub)}
.demo summary{cursor:pointer;padding:8px 14px;list-style:none;display:flex;align-items:center;gap:8px}
.demo summary::-webkit-details-marker{display:none}
.demo summary b{color:var(--ink);font-weight:600}
.demo .demo-body{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:0 14px 10px}
.demo input{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:4px 8px;font-size:12.5px}
@media (max-width:820px){.demo{padding:0 18px}}

main{max-width:760px;margin:0 auto;padding:48px 24px 72px}
main.wide{max-width:1120px}
@media (max-width:820px){main,main.wide{padding:20px 18px 140px}}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 16px;border-radius:99px;font-weight:600;font-size:13.5px;white-space:nowrap;transition:transform .2s var(--spring),background .2s,box-shadow .2s}
.btn:active{transform:scale(.95)}
.btn svg{width:15px;height:15px;flex:none}
.btn-ink{background:var(--ink);color:var(--cream)}
.btn-pink{background:var(--pink);color:var(--ink)}
.btn-me{background:var(--me);color:#fff}
.btn-soft{background:var(--linen);color:var(--ink)}
.btn-soft:hover{background:var(--line)}
.btn-line{border:1.5px solid var(--line);background:var(--paper)}
.btn-rasp{background:var(--rasp);color:#fff}
.btn-sm{height:32px;padding:0 12px;font-size:12.5px}
.btn-discord{background:var(--linen);color:var(--ink)}
.btn-discord:hover{background:var(--line)}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--paper);box-shadow:0 1px 0 var(--line);transition:transform .25s var(--spring),opacity .2s}
.icon-btn:hover{transform:scale(1.06)}
.icon-btn:active{transform:scale(.92)}
.icon-btn:disabled{opacity:.3;cursor:default;transform:none}
.icon-btn svg{width:18px;height:18px}

/* ---------- view motion ---------- */
.view{animation:viewIn .55s var(--ease) both}
.view.from-right{animation:fromRight .45s var(--ease) both}
.view.from-left{animation:fromLeft .45s var(--ease) both}
.view.still{animation:none}
.stagger>*{animation:rise .6s var(--ease) both}
.stagger>*:nth-child(2){animation-delay:.06s}.stagger>*:nth-child(3){animation-delay:.12s}.stagger>*:nth-child(4){animation-delay:.18s}.stagger>*:nth-child(5){animation-delay:.24s}.stagger>*:nth-child(6){animation-delay:.3s}
.view.from-right .stagger>*,.view.from-left .stagger>*,.still .stagger>*,.view.still .stagger>*,.view.still .rows li,.view.still .inspector,.view.still .savebar{animation:none}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fromRight{from{opacity:0;transform:translateX(56px)}to{opacity:1;transform:none}}
@keyframes fromLeft{from{opacity:0;transform:translateX(-56px)}to{opacity:1;transform:none}}
.xfade{animation:xfade .45s ease both}
.slide-next{animation:fromRight .5s var(--ease) both}
.slide-prev{animation:fromLeft .5s var(--ease) both}
.view .stagger>.slide-next{animation:fromRight .5s var(--ease) both}
.view .stagger>.slide-prev{animation:fromLeft .5s var(--ease) both}
.view .stagger>.side-col.slide-next,.view .stagger>.side-col.slide-prev{animation-delay:.06s}
@keyframes xfade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- TODAY ---------- */
.strip{display:flex;align-items:center;gap:10px;margin-top:6px}
.strip .days{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.dchip{position:relative;display:flex;flex-direction:column;align-items:center;padding:8px 0 9px;border-radius:16px;background:transparent;transition:background .3s var(--ease),transform .25s var(--spring)}
.dchip:hover{background:var(--linen)}
.dchip:active{transform:scale(.94)}
.dchip .en{font-size:12.5px;font-weight:500;color:var(--sub);text-transform:lowercase}
.dchip b{font-family:var(--en);font-size:20px;font-weight:600;line-height:1.15}
.dchip .dots{display:flex;gap:3px;margin-top:4px;height:6px}
.dchip .dots i{width:6px;height:6px;border-radius:50%;background:var(--stone-soft)}
.dchip .dots i.full{background:var(--c)}
.dchip .dots i.part{background:linear-gradient(90deg,var(--c) 50%,var(--stone-soft) 50%)}
.dchip .dots i.miss{background:var(--rasp-soft);box-shadow:inset 0 0 0 1.5px #EDA8BB}
.dchip.sel{background:var(--ink)}
.dchip.sel .en,.dchip.sel b{color:var(--cream)}
.dchip.is-today::after{content:"today";position:absolute;top:-8px;font-family:var(--en);font-size:10px;font-weight:600;background:var(--pink);color:var(--ink);padding:0 6px;border-radius:99px;line-height:16px}
.dchip.wkend{grid-column:span 1}

/* today layout */
.today-grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:36px 22px;align-items:start;margin-top:6px}
.t-head{grid-column:1/-1;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.dtitle .paren{display:block}
.dtitle h1{font-family:var(--en);font-weight:500;font-size:clamp(34px,5vw,46px);line-height:1.05;letter-spacing:-.02em;text-transform:lowercase;margin-top:4px}
.dtitle p{font-size:13.5px;color:var(--sub);margin-top:6px}
.dtitle .back{margin-left:4px;height:24px;padding:0 10px;font-size:12px;vertical-align:1px}
.dtitle{padding-bottom:22px}
.dtitle .chips-row{height:24px}
.t-head .strip{width:min(470px,100%);margin:0}
.side-col{position:sticky;top:96px}
.chapter{--t:var(--pink);padding:26px 24px 22px;overflow:hidden;--notch-y:118px}
.chapter .petals{position:absolute;inset:0;pointer-events:none;z-index:0}
.chapter .petals svg{position:absolute;fill:#E89DC0}
.chapter>*:not(.petals){position:relative;z-index:1}

.chapter h2{font-family:var(--en);font-size:26px;font-weight:600;line-height:1.1;margin-top:12px;letter-spacing:-.01em}
.chapter .ko{font-size:13px;color:var(--cocoa-deep);margin-top:4px}
.chapter .facts{list-style:none;margin-top:18px;padding-top:14px;border-top:2px dotted rgba(110,79,67,.25);display:grid;gap:8px}
.chapter .facts li{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.chapter .facts li span:first-child{font-family:var(--en);font-weight:500;color:var(--cocoa-deep)}
.chapter .facts li b{font-weight:600;text-align:right}
.chapter .gram{margin-top:12px;font-size:12.5px;line-height:1.5;color:var(--ink);background:rgba(255,252,247,.55);border-radius:12px;padding:9px 11px}
.chapter .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}
.chapter .acts .btn{background:rgba(255,252,247,.7)}
.chapter .acts .btn:hover{background:var(--paper)}
@media (max-width:980px){
  .today-grid{grid-template-columns:minmax(0,1fr);gap:18px}
  .side-col{position:relative;top:0}
  .t-head{flex-direction:column-reverse;align-items:stretch;gap:14px}
  .t-head .strip{width:100%}
}
.board{padding:24px 24px 10px;--t:var(--paper);--notch-y:46px}
.board-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:14px;border-bottom:2px dotted var(--line)}
.board-head h2{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;white-space:nowrap}
.board-head h2 .en{font-size:24px;font-weight:600}
.board-head h2 small{font-size:13px;color:var(--sub);font-weight:500}
.scores{display:flex;gap:16px}
.score{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600}
.score .sf{width:24px;height:24px;display:grid;place-items:center}.score .sf svg{width:24px;height:24px}
.score .ring .bg,.score .ring .fg{fill:none;stroke-width:3}
.score .ring .bg{stroke:var(--stone-soft)}
.score .ring .fg{stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .8s var(--ease)}
.score .n{font-family:var(--en);font-size:15px;font-weight:600}
.score .nm{color:var(--sub);font-weight:600;margin-right:3px}

.tasks{list-style:none}
.task{position:relative;display:flex;gap:14px;align-items:flex-start;padding:16px 0;border-bottom:1px solid var(--stone-soft)}
.task:last-child{border-bottom:0}
.bloom{position:relative;flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;transition:transform .25s var(--spring)}
.bloom:not(:disabled):hover{transform:rotate(-12deg) scale(1.05)}
.bloom:not(:disabled):active{transform:scale(.88)}
.bloom .off{width:34px;height:34px;border-radius:50%;border:2.5px dotted var(--stone)}
.bloom .on{position:absolute;inset:0;display:grid;place-items:center}
.bloom .on svg{width:42px;height:42px}
.bloom:disabled{cursor:default}
.bloom.locked .off{border-style:solid;border-color:var(--stone-soft);background:var(--linen)}
.bloom.missed .off{border:2.5px solid #EDA8BB;background:var(--rasp-soft)}
.task.pop .bloom .on svg{animation:bloomIn .65s var(--spring) both}
@keyframes bloomIn{0%{transform:scale(.1) rotate(-120deg)}100%{transform:scale(1) rotate(0)}}
.t-body{flex:1;min-width:0;padding-top:2px}
.t-title{font-weight:650;font-size:16px;line-height:1.4;transition:color .3s}
.task.done .t-title{color:var(--faint)}
.t-sub{font-size:12.5px;color:var(--sub);margin-top:4px;line-height:1.6}
.t-sub .sep{margin:0 6px;color:var(--faint)}
.t-sub svg{width:13px;height:13px;vertical-align:-2px;margin-right:5px}
.t-sub .due{color:var(--rasp);font-weight:600}
.t-sub .missed{color:var(--rasp);font-weight:600}
.t-hint{margin-top:10px;font-size:12.5px;line-height:1.55;color:var(--cocoa-deep);background:var(--blush-2);border-radius:12px;padding:9px 12px}
.body-yena .t-hint{background:#F6EEE9}
.t-side{flex:none;display:flex;align-items:center;gap:8px;padding-top:4px}
.mate{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--faint);height:32px;min-width:66px;padding:0 4px;border-radius:99px;transition:background .3s}
.mate .mf{width:22px;height:22px;display:grid;place-items:center}
.mate .mf svg{width:22px;height:22px}
.mate .mf i{width:17px;height:17px;border-radius:50%;border:1.5px dotted var(--stone)}
.mate.on{color:var(--ink)}
.mate.flash{animation:flash 1.4s var(--ease)}
@keyframes flash{0%,100%{background:transparent}30%{background:var(--mate-soft)}}
@media (max-width:560px){
  .task{gap:12px}
  .t-side{gap:4px;padding-top:2px}
  .mate{font-size:0;gap:0;padding:0;min-width:0;width:32px;justify-content:center}
  .t-side .btn span.lbl{display:none}
  .t-side .btn{width:36px;padding:0}
  .board{padding:20px 18px 6px}
  .score .nm{display:none}
  .board-head{flex-wrap:wrap}
}

.stamp{position:relative;margin:14px 0 2px;width:max-content;transform:rotate(-2deg);background:var(--ink);color:var(--cream);font-family:var(--en);font-size:13px;font-weight:500;padding:6px 12px 6px 8px;border-radius:99px;display:flex;align-items:center;gap:6px;animation:stampIn .6s var(--spring) both}
.stamp svg{width:18px;height:18px}
@keyframes stampIn{from{transform:rotate(-14deg) scale(1.6);opacity:0}to{transform:rotate(-2deg) scale(1);opacity:1}}
.empty-day{padding:26px 4px 20px;text-align:center;color:var(--sub);font-size:14px}

/* petals burst */
.petal-fx{position:fixed;width:10px;height:14px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;pointer-events:none;z-index:90;animation:petal .8s var(--ease) forwards}
@keyframes petal{0%{transform:translate(-50%,-50%) rotate(0) scale(.6);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--r)) scale(1);opacity:0}}

/* ---------- WEEK ---------- */
.week-head{display:flex;align-items:center;gap:14px;margin-top:10px}
.week-head .mid{flex:1;min-width:0}
.wk-meta{font-family:var(--en);font-size:14px;font-weight:500;color:var(--sub);letter-spacing:.01em}
.wk-meta span{margin:0 8px;color:var(--faint)}
.week-head .mid h1{margin-top:8px;font-family:var(--en);font-size:clamp(28px,4.5vw,40px);font-weight:500;line-height:1.05;letter-spacing:-.015em}
.week-head .mid p{font-size:13.5px;color:var(--sub);margin-top:6px}
.week-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:22px}
.edit-btn{margin-left:auto;color:var(--sub);background:transparent;font-weight:500}
.edit-btn:hover{background:var(--linen);color:var(--ink)}
@media (max-width:560px){.week-tools .lbl,.week-tools small{display:none}.week-tools .btn{padding:0 14px}}
.wboard{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-top:32px}
.col{--t:var(--paper);padding:26px 14px 14px;min-height:300px;display:flex;flex-direction:column;--notch-y:72px;transition:background .25s,box-shadow .25s,transform .3s var(--spring)}
.col.today{--t:var(--pink)}
.col.today .col-head small{color:var(--cocoa-deep)}
.col-head{display:flex;align-items:baseline;justify-content:space-between;padding:0 4px 16px;margin-bottom:14px;border-bottom:2px dotted var(--line);cursor:pointer}
.col.today .col-head{border-bottom-color:rgba(110,79,67,.2)}
.col-head .en{font-size:24px;font-weight:600;text-transform:lowercase}
.col-head small{font-size:12px;color:var(--sub);font-family:var(--en)}
.col-head .tday{font-family:var(--en);font-size:10.5px;font-weight:600;background:var(--ink);color:var(--cream);border-radius:99px;padding:1px 7px;margin-left:6px;vertical-align:3px}
.chips{display:flex;flex-direction:column;gap:8px;flex:1}
.chipx{position:relative;display:block;background:var(--cream);border-radius:14px;padding:10px 11px 9px;text-align:left;width:100%;transition:transform .3s var(--spring),box-shadow .3s,background .2s}
.col.today .chipx{background:rgba(255,252,247,.75)}

const state = { ready:false, settings:{...DEFAULT_SETTINGS}, routines:[{from:DEFAULT_SETTINGS.startDate, days:DEFAULT_ROUTINE}], days:{}, fines:[] };

function makeLocalStore(onChange){
  const KEY='jaksim3-demo';
  const load=()=>{ try{ return JSON.parse(safeLS.get(KEY)||'null'); }catch(e){ return null; } };
  const fresh=()=>({settings:{...DEFAULT_SETTINGS}, routines:[{from:DEFAULT_SETTINGS.startDate, days:DEFAULT_ROUTINE}], days:{}, fines:[]});
  let mem={...fresh(), ...(load()||{})};
  const emit=()=>{ Object.assign(state, JSON.parse(JSON.stringify(mem)), {ready:true}); onChange(); };
  const save=()=>{ safeLS.set(KEY, JSON.stringify(mem)); emit(); };
  try{ window.addEventListener('storage', e=>{ if(e.key===KEY){ mem={...fresh(),...(load()||{})}; emit(); } }); }catch(e){}
  setTimeout(emit,0);
  return {
    mode:'local',
    setCheck(date,person,id,val){ mem.days[date]??={}; mem.days[date][person]??={}; mem.days[date][person][id]=val; save(); },
    addFine(f){ mem.fines.push({id:uid(), createdAt:Date.now(), ...f}); save(); },
    deleteFine(id){ mem.fines=mem.fines.filter(f=>f.id!==id); save(); },
    saveMeta(settings,routines){ mem.settings=settings; mem.routines=routines; save(); },
    reset(){ safeLS.del(KEY); mem=fresh(); save(); }
  };
}
async function makeFirebaseStore(onChange){
  const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
  const fs = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
  const db = fs.getFirestore(initializeApp(firebaseConfig));
  const metaRef = fs.doc(db,'jaksim','meta');
  const got={meta:false,days:false,fines:false};
  const tick=()=>{ if(got.meta&&got.days&&got.fines){ state.ready=true; onChange(); } };
  fs.onSnapshot(metaRef, snap=>{
    if(!snap.exists()){ fs.setDoc(metaRef,{settings:DEFAULT_SETTINGS, routines:[{from:DEFAULT_SETTINGS.startDate, days:DEFAULT_ROUTINE}]}); return; }
    const d=snap.data(); state.settings={...DEFAULT_SETTINGS,...d.settings}; state.routines=d.routines; got.meta=true; tick();
  });
  fs.onSnapshot(fs.collection(db,'jaksim_days'), snap=>{ const days={}; snap.forEach(x=>days[x.id]=x.data()); state.days=days; got.days=true; tick(); });
  fs.onSnapshot(fs.collection(db,'jaksim_fines'), snap=>{ const f=[]; snap.forEach(x=>f.push({id:x.id,...x.data()})); state.fines=f; got.fines=true; tick(); });
  return {
    mode:'firebase',
    setCheck:(date,person,id,val)=>fs.setDoc(fs.doc(db,'jaksim_days',date),{[person]:{[id]:val}},{merge:true}),
    addFine:f=>fs.addDoc(fs.collection(db,'jaksim_fines'),{createdAt:Date.now(),...f}),
    deleteFine:id=>fs.deleteDoc(fs.doc(db,'jaksim_fines',id)),
    saveMeta:(settings,routines)=>fs.setDoc(metaRef,{settings,routines})
  };
}

const start = () => state.settings.startDate;
const endDate = () => addDays(start(), WEEKS*7-1);
const lastWeekday = () => addDays(endDate(),-2);
const weekOf = d => Math.floor(diffDays(d,start())/7);
const chapterOf = d => { const w=weekOf(d); return (w>=0&&w<WEEKS)?CHAPTERS[w]:null; };
const weekStart = w => addDays(start(), w*7);
function routineFor(date){
  const rs=[...state.routines].sort((a,b)=>a.from<b.from?-1:1); let cur=rs[0];
  for(const r of rs) if(r.from<=date) cur=r; return cur.days;
}
function itemsFor(date){
  const w=dow(date); if(w<1||w>5) return [];
  const wk=weekOf(date); if(wk<0||wk>=WEEKS) return [];
  return routineFor(date)[w]||[];
}
const isChecked = (d,p,id) => !!state.days[d]?.[p]?.[id];
const deadlineOf = (d,i) => i.dueSunday ? addDays(d,7-dow(d)) : d;
function canEdit(d,i,p){ if(p!==me) return false; const t=today(); if(d>t||t>deadlineOf(d,i)) return false; return d===t||!!i.dueSunday; }
function debtsFor(p){
  const out=[], t=today(); if(t<=start()) return out;
  const last = addDays(t,-1)<endDate()?addDays(t,-1):endDate();
  for(let d=start(); d<=last; d=addDays(d,1)){
    const items=itemsFor(d); if(!items.length) continue;
    const same=items.filter(i=>!i.dueSunday), miss=same.filter(i=>!isChecked(d,p,i.id));
    if(same.length&&miss.length) out.push({key:`${d}_${p}`, person:p, date:d, items:miss.map(i=>i.title)});
    for(const i of items.filter(i=>i.dueSunday)){ const dl=deadlineOf(d,i); if(dl<t&&!isChecked(d,p,i.id)) out.push({key:`${d}_${p}_${i.id}`, person:p, date:dl, origin:d, items:[i.title], late:true}); }
  }
  const settled=new Set(state.fines.map(f=>f.forKey).filter(Boolean));
  return out.filter(x=>!settled.has(x.key));
}
const allDebts = () => [...debtsFor('juhyun'),...debtsFor('yena')].sort((a,b)=>a.date<b.date?-1:1);
function dayStatus(d,p){
  const items=itemsFor(d); if(!items.length) return 'none';
  const done=items.filter(i=>isChecked(d,p,i.id)).length, t=today();
  if(done===items.length) return 'full';
  if(d>t) return 'future';
  const lastDl=items.reduce((m,i)=>deadlineOf(d,i)>m?deadlineOf(d,i):m,d);
  if(lastDl>=t) return done?'part':'pend';
  return done?'part':'miss';
}
function personStats(p){
  let total=0,done=0; const t=today();
  for(let w=0;w<WEEKS;w++) for(let k=1;k<=5;k++){ const d=addDays(weekStart(w),k-1); if(d>t) continue; for(const i of itemsFor(d)){ total++; if(isChecked(d,p,i.id)) done++; } }
  let streak=0; let d=t;
  if(dayStatus(d,p)!=='full') d=addDays(d,-1);
  for(let guard=0; guard<100 && d>=start(); guard++, d=addDays(d,-1)){
    const s=dayStatus(d,p); if(s==='none') continue; if(s==='full') streak++; else break;
  }
  return {total,done,pct:total?Math.round(done/total*100):0,streak};
}
const stepWeekday = (d,dir) => { let x=addDays(d,dir); while(dow(x)===0||dow(x)===6) x=addDays(x,dir); return x; };

function countUp(el, from, to, dur=1100){
  if(!el) return; if(reduced||from===to){ el.textContent=won(to); return; }
  const t0=performance.now();
  const step=now=>{ const k=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-k,3); el.textContent=won(Math.round(from+(to-from)*e)); if(k<1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

function weekStrip(d){

  const w=Math.min(Math.max(weekOf(wkend?fri:d),0),WEEKS-1), ws=weekStart(w), t=today();
  const prev=wkend?fri:stepWeekday(d,-1);
  const next=wkend?addDays(fri,3):stepWeekday(d,1);
  const canPrev = prev>=start(), canNext = next<=lastWeekday();
  return `<div class="strip">
    <button class="icon-btn" data-act="day" data-to="${prev}" ${canPrev?'':'disabled'} aria-label="이전 날">${I.l}</button>
    <div class="days">${[1,2,3,4,5].map(k=>{ const x=addDays(ws,k-1);
      const dots=['juhyun','yena'].map(p=>{const s=dayStatus(x,p);return `<i class="${s==='full'?'full':s==='part'?'part':s==='miss'?'miss':''}" style="--c:${PCOLOR[p]}"></i>`;}).join('');
      return `<button class="dchip ${x===d?'sel':''} ${x===t?'is-today':''}" data-act="day" data-to="${x}" aria-label="${krDateDow(x)}" ${x===d?'aria-current="date"':''}><span class="en">${DAYS_EN[k]}</span><b>${parse(x).getDate()}</b><span class="dots">${dots}</span></button>`;}).join('')}</div>
    <button class="icon-btn" data-act="day" data-to="${next}" ${canNext?'':'disabled'} aria-label="다음 날">${I.r}</button>
  </div>`;
}

function viewToday(){

      <div class="grow ghead" aria-hidden="true"><span></span>${[1,2,3,4,5].map(k=>`<span>${DAYS_EN[k]}</span>`).join('')}</div>
      <div class="stagger">${rows}</div>
      <div class="legend"><span><span class="fl">${flower(PCOLOR.juhyun)}</span>다 했어요</span><span><span class="fl">${halfFlower(PCOLOR.juhyun)}</span>일부만</span><span><span class="fl pend"><i></i></span>진행 중</span><span><span class="fl miss"><i></i></span>놓친 날</span><span>주차를 누르면 그 주 일정으로 가요</span></div>
    </section></div>`;
}

/* ---------- JAR ---------- */
const lvlY = l => l<=0 ? 215 : (1-l)*176;
function jarSVG(level){
  const body='M44 66Q44 56 54 56H146Q156 56 156 66V206Q156 230 132 230H68Q44 230 44 206Z';
  return `<svg viewBox="0 0 200 240" aria-hidden="true">
    <defs><clipPath id="jarclip"><path d="${body}"/></clipPath><filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.6"/></filter></defs>
    <rect x="64" y="30" width="72" height="20" rx="8" fill="#EFE3D6"/>
    <path d="${body}" fill="#F3E8DC"/>
    <g clip-path="url(#jarclip)">
      <g class="liquid" data-to="${level}" style="transform:translateY(${lvlY(level)}px)">
        <g filter="url(#soft)">
          <g class="wave back"><path d="M-40 54 Q-20 46 0 54 T40 54 T80 54 T120 54 T160 54 T200 54 T240 54 T280 54 V300 H-40Z" fill="#F6CADD"/></g>
          <g class="wave"><path d="M0 60 Q20 52 40 60 T80 60 T120 60 T160 60 T200 60 T240 60 T280 60 V300 H0Z" fill="#EFA9C9"/></g>
          <rect x="-20" y="64" width="240" height="240" fill="#EFA9C9"/>
        </g>
      </g>
    </g>
  </svg>`;
}
function viewJar(){
  const paid=state.fines.filter(f=>f.type!=='waived');
  const total=paid.reduce((s,f)=>s+(+f.amount||0),0), each=Math.floor(total/2);
  const level=total?Math.max(.1,Math.min(1,total/(OPIC_FEE*2))):0;
  const by=p=>paid.filter(f=>f.person===p).reduce((s,f)=>s+(+f.amount||0),0);
  const debts=allDebts();
  const hist=[...state.fines].sort((a,b)=>(b.paidOn||'').localeCompare(a.paidOn||'')||(b.createdAt||0)-(a.createdAt||0));
  return `<div class="stagger">
    <div class="jar-wrap">
      <div class="jar-col"><div class="chips-row"><span class="chip">the OPIc jar</span><span class="ko" style="font-size:13px;color:var(--sub)">오픽 저금통</span></div><div class="jar">${jarSVG(level)}</div></div>
      <div class="jar-info">
        <div class="amt num"><span data-amt="${total}">${won(total)}</span><small>원</small></div>
        <p class="sub">모인 벌금은 반씩 나눠서 각자 오픽 응시료에 보태요.<br>응시료 84,000원 중 <b>${Math.round(each/OPIC_FEE*100)}%</b>를 채웠어요.</p>
        <div class="each"><div><div class="k">1인당 지원금</div><div class="v num">${won(each)}<small>원</small></div></div><div><div class="k">미납</div><div class="v num" style="color:${debts.length?'var(--rasp)':'inherit'}">${won(debts.length*FINE)}<small>원</small></div></div>
        ${['juhyun','yena'].map(p=>`<div><div class="k"><span style="width:14px;height:14px;display:inline-block">${flower(PCOLOR[p])}</span>${iga(PEOPLE[p].name)} 낸 돈</div><div class="v num">${won(by(p))}<small>원</small></div></div>`).join('')}</div>
      </div>
    </div>
    <section class="ticket sheet"><span class="hole"></span>
      <div class="sheet-head"><h2><span class="en">unpaid</span><small>미납 벌금 ${debts.length}건</small></h2></div>
      ${debts.length?`<ul class="rows">${debts.map(d=>`<li>
        <span class="face">${flower(PCOLOR[d.person])}</span>
        <div class="m"><div class="t">${PEOPLE[d.person].name}, ${shortDate(d.origin||d.date)}${d.late?' 녹음':''}</div><div class="s">${esc(d.items.join(', '))} 못 함</div></div>
        <div class="acts"><button class="btn btn-sm btn-ink" data-act="pay" data-key="${d.key}" data-p="${d.person}">냈어요</button><button class="btn btn-sm btn-soft" data-act="waive" data-key="${d.key}" data-p="${d.person}">면제</button></div></li>`).join('')}</ul>
        <p class="note">실제로 송금한 뒤 '냈어요'를 누르면 오늘 날짜로 기록돼요. 둘이 합의한 날은 '면제'로 넘겨요.</p>`
      :`<div class="blank">${flower('#EFA9C9','#DE6FA1')}미납 벌금이 없어요. 이대로만 가요.</div>`}
    </section>
    <section class="ticket sheet"><span class="hole"></span>
      <div class="sheet-head"><h2><span class="en">history</span><small>납부 기록</small></h2><button class="btn btn-sm btn-soft" data-act="open-fine">${I.plus}직접 기록</button></div>
      ${hist.length?`<ul class="rows">${hist.map(f=>`<li>
        <span class="face">${flower(PCOLOR[f.person]||'#C9C2B8')}</span>
        <div class="m"><div class="t">${PEOPLE[f.person]?.name||''}${f.type==='waived'?'<span class="tag">면제</span>':''}</div><div class="s">${f.type==='waived'?'면제한 날':'낸 날'} ${f.paidOn?shortDate(f.paidOn):''}${f.memo?`, ${esc(f.memo)}`:''}</div></div>
        <span class="a num ${f.type==='waived'?'void':''}">${won(+f.amount||0)}</span>
        <button class="btn btn-sm ${confirmDel===f.id?'btn-rasp':'btn-soft'}" data-act="del-fine" data-id="${f.id}">${confirmDel===f.id?'정말 삭제':'삭제'}</button></li>`).join('')}</ul>`
      :'<div class="blank">아직 기록이 없어요.</div>'}
    </section></div>`;
}
function viewModal(){
  return `<div class="scrim" data-act="close-modal"><div class="ticket modal" role="dialog" aria-modal="true" aria-label="벌금 직접 기록" data-stop><span class="hole"></span>
    <div class="sheet-head"><h2><span class="en">add a record</span><small>벌금 직접 기록</small></h2><button class="icon-btn" data-act="close-modal" aria-label="닫기" style="transform:rotate(45deg)">${I.plus}</button></div>
    <div class="form" data-form="fine">
      <label>누가 냈나요?<div class="seg" role="group">${['juhyun','yena'].map(p=>`<button type="button" data-act="seg" data-p="${p}" aria-pressed="${p===me}">${PEOPLE[p].name}</button>`).join('')}</div><input type="hidden" name="person" value="${me}"></label>
      <div class="two"><label>낸 날짜<input class="field" type="date" name="paidOn" value="${today()}" required></label><label>금액(원)<input class="field num" type="number" name="amount" value="${FINE}" step="1000" min="1000" required></label></div>
      <label>메모 (선택)<input class="field" name="memo" placeholder="예: 11/12 녹음 못 함" maxlength="60"></label>
      <button class="btn btn-me" type="button" data-act="fine-save" style="height:46px">기록 추가</button>
    </div></div></div>`;
}
function noticeBar(){
  if(editing||modal||tab==='jar') return '';
  const debts=debtsFor(me); if(!debts.length) return '';
  return `<div class="notice" role="status"><div class="notice-wrap"><div class="ticket notice-in"><span class="ico">${flower('#C9466B','#FFFCF7')}</span>
    <p><span class="chip on-dark">unpaid</span> 벌금 ${won(debts.length*FINE)}원이 쌓였어요. ${debts.length>1?`놓친 날이 ${debts.length}번 있어요.`:`${shortDate(debts[0].origin||debts[0].date)} 할 일을 놓쳤어요.`}</p>
    <button class="btn btn-sm" data-act="tab" data-tab="jar">jar 보기</button></div></div></div>`;
}

/* =========================================================
   8) 이벤트
   ========================================================= */
function goDay(to){
  const cur=viewDate||today();
  if(to===cur) return;
  anim.view = to>cur?'next':'prev';
  viewDate = to===today()?null:to; render();
}
document.addEventListener('click', async ev=>{
  const b=ev.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act;
  if(a==='close-modal'){ if(ev.target.closest('[data-stop]')&&!ev.target.closest('.icon-btn')) return; modal=null; anim.view='still'; render(); return; }
  if(a==='me'){ me=b.dataset.p; safeLS.set('jaksim3-me',me); prevPartner=null; anim.view='fade'; render(); return; }
  if(a==='tab'){ if(tab===b.dataset.tab&&!editing) return; tab=b.dataset.tab; safeLS.set('jaksim3-tab2',tab); confirmDel=null; editing=null; anim.view='fade'; if(tab==='jar') anim.jarEnter=true; window.scrollTo({top:0,behavior:'instant'}); render(); return; }
  if(a==='day'){ goDay(b.dataset.to); return; }
  if(a==='goto-day'){ tab='today'; safeLS.set('jaksim3-tab2',tab); viewDate=b.dataset.to===today()?null:b.dataset.to; anim.view='fade'; window.scrollTo({top:0,behavior:'instant'}); render(); return; }
  if(a==='goto-week'){ tab='week'; safeLS.set('jaksim3-tab2',tab); viewWeek=+b.dataset.w; anim.view='fade'; window.scrollTo({top:0,behavior:'instant'}); render(); return; }
  if(a==='check'){
    const {date,id}=b.dataset, v=!isChecked(date,me,id);
    state.days[date]??={}; state.days[date][me]??={}; state.days[date][me][id]=v;
    if(v) anim.pop=`${date}|${id}`;
    anim.view=null; render(); holdUntil=Date.now()+800;
    try{ await store.setCheck(date,me,id,v); }catch(e){ toast('저장하지 못했어요. 인터넷 연결을 확인해 주세요.'); }
    const items=itemsFor(date).filter(i=>date===today()||i.dueSunday);
    if(v&&items.every(i=>isChecked(date,me,i.id))) setTimeout(()=>toast(items.every(i=>isChecked(date,OTHER[me],i.id))?'둘 다 끝! 오늘도 피었어요':'오늘 할 일 끝! 수고했어요'),350);
    return;
  }
  if(a==='wk'){ viewWeek=Math.min(WEEKS-1,Math.max(0,viewWeek+(+b.dataset.d))); anim.view=+b.dataset.d>0?'next':'prev'; render(); return; }
  if(a==='wk-now'){ viewWeek=null; anim.view='fade'; render(); return; }
  if(a==='pay'||a==='waive'){
    const before=state.fines.filter(f=>f.type!=='waived').reduce((s,f)=>s+(+f.amount||0),0);
    if(a==='pay') anim.jar={from:before, fromLevel:before?Math.max(.1,Math.min(1,before/(OPIC_FEE*2))):0, person:b.dataset.p};
    anim.view='still';
    await store.addFine({person:b.dataset.p, amount:FINE, paidOn:today(), forKey:b.dataset.key, type:a==='pay'?'paid':'waived', memo:a==='waive'?'합의 면제':''});
    toast(a==='pay'?'저금통에 1만 원이 들어갔어요':'면제로 처리했어요', PCOLOR[b.dataset.p]); return;
  }
  if(a==='open-fine'){ modal='fine'; anim.view='still'; render(); setTimeout(()=>document.querySelector('.modal input[name=amount]')?.focus(),50); return; }
  if(a==='fine-save'){ saveFine(); return; }
  if(a==='seg'){ const f=b.closest('[data-form]'); f.querySelector('[name=person]').value=b.dataset.p; f.querySelectorAll('[data-act=seg]').forEach(x=>x.setAttribute('aria-pressed',x===b)); return; }
  if(a==='del-fine'){ anim.view='still'; if(confirmDel!==b.dataset.id){ confirmDel=b.dataset.id; render(); return; } confirmDel=null; await store.deleteFine(b.dataset.id); toast('기록을 삭제했어요'); return; }
  if(a==='sim-reset'){ simToday=null; viewDate=null; viewWeek=null; anim.view='fade'; render(); return; }
  if(a==='demo-reset'){ anim.view='still'; store.reset(); toast('미리보기 기록을 지웠어요'); return; }
  // ---- 루틴 편집 ----
  if(a==='edit'){ const base=routineFor(today()<start()?start():today()); editing={routine:JSON.parse(JSON.stringify(base)), settings:{...state.settings}, applyFrom:'today', sel:null}; anim.view='fade'; render(); return; }
  if(!editing) return;
  anim.view='still';
  const R=editing.routine, S=editing.sel;
  if(a==='ed-cancel'){ editing=null; anim.view='fade'; render(); return; }
  if(a==='ed-sel'){ const k=b.dataset.k, i=+b.dataset.i; editing.sel=(S&&S.k==k&&S.i===i)?null:{k,i}; render(); if(editing.sel) setTimeout(()=>document.querySelector('.inspector')?.scrollIntoView({behavior:'smooth',block:'nearest'}),60); return; }
  if(a==='ed-desel'){ editing.sel=null; render(); return; }
  if(a==='ed-drop'||a==='ed-day'){ if(!S) return; moveTo(b.dataset.k); return; }
  if(a==='ed-add'){ const k=b.dataset.k; (R[k]??=[]).push({id:uid(),title:'',part:'MS',kind:'watch'}); editing.sel={k,i:R[k].length-1}; render(); setTimeout(()=>{const f=document.querySelector('.inspector [data-ed=title]'); f?.focus(); f?.scrollIntoView({behavior:'smooth',block:'center'});},60); return; }
  if(!S) { if(a==='ed-apply'){ editing.applyFrom=b.dataset.v; render(); } else if(a==='ed-save') saveRoutine(); return; }
  const it=R[S.k][S.i];
  if(a==='ed-kind'){ it.kind=b.dataset.v; render(); return; }
  if(a==='ed-due'){ it.dueSunday=!it.dueSunday; render(); return; }
  if(a==='ed-move'){ const arr=R[S.k], j=S.i+(+b.dataset.d); if(j<0||j>=arr.length) return; [arr[S.i],arr[j]]=[arr[j],arr[S.i]]; S.i=j; render(); return; }
  if(a==='ed-del'){ R[S.k].splice(S.i,1); editing.sel=null; render(); return; }
  if(a==='ed-apply'){ editing.applyFrom=b.dataset.v; render(); return; }
  if(a==='ed-save'){ saveRoutine(); return; }
});
function moveTo(k){
  const S=editing.sel, R=editing.routine; if(!S||S.k==k) { if(S) render(); return; }
  const [it]=R[S.k].splice(S.i,1); (R[k]??=[]).push(it); editing.sel={k:String(k),i:R[k].length-1}; anim.view='still'; render();
  toast(`${DAYS_KO[k]}요일로 옮겼어요`);
}
async function saveRoutine(){
  const t=today();
  let from = editing.applyFrom==='next' ? addDays(t,((8-dow(t))%7)||7) : t;
  if(from<start()) from=start();
  const clean={}; for(const k of [1,2,3,4,5]) clean[k]=(editing.routine[k]||[]).filter(i=>(i.title||'').trim()).map(i=>({...i,title:i.title.trim(),dueSunday:!!i.dueSunday}));
  const kept=state.routines.filter(r=>r.from<from); kept.push({from,days:clean});
  const settings={...editing.settings};
  editing=null; anim.view='fade';
  await store.saveMeta(settings,kept);
  toast(`${shortDate(from)}부터 새 루틴이 적용돼요`);
}
document.addEventListener('keydown', ev=>{
  if(modal&&ev.key==='Enter'&&ev.target.closest('[data-form="fine"]')&&!ev.isComposing){ ev.preventDefault(); saveFine(); return; }
  if(ev.key==='Escape'&&modal){ modal=null; anim.view='still'; render(); return; }
  if(ev.target.matches('input,select,textarea')) return;
  if(ev.key==='Escape'&&modal){ modal=null; anim.view='still'; render(); return; }
  if(ev.target.closest('.col-head')&&(ev.key==='Enter'||ev.key===' ')){ ev.preventDefault(); ev.target.closest('.col-head').click(); return; }
  if(tab==='today'&&!modal&&(ev.key==='ArrowLeft'||ev.key==='ArrowRight')){
    const btn=document.querySelectorAll('.strip > .icon-btn')[ev.key==='ArrowLeft'?0:1]; if(btn&&!btn.disabled) btn.click();
  }
});
document.addEventListener('input', ev=>{
  const el=ev.target;
  if(editing&&el.dataset.ed==='title'&&editing.sel){ const {k,i}=editing.sel; editing.routine[k][i].title=el.value; const chip=document.querySelector(`.chipx[data-k="${k}"][data-i="${i}"] .ct`); if(chip) chip.textContent=el.value||'이름 없음'; }
  if(editing&&el.dataset.set) editing.settings[el.dataset.set]=el.value.trim();
});
document.addEventListener('change', ev=>{
  const el=ev.target;
  if(el.dataset.act==='sim'&&el.value){ simToday=el.value; viewDate=null; viewWeek=null; anim.view='fade'; render(); return; }
  if(editing&&el.dataset.ed==='part'&&editing.sel){ const {k,i}=editing.sel; editing.routine[k][i].part=el.value; }
});
async function saveFine(){
  const f=document.querySelector('[data-form="fine"]'); if(!f) return;
  const v=n=>f.querySelector(`[name="${n}"]`).value;
  const amount=parseInt(v('amount'),10), paidOn=v('paidOn'), person=v('person');
  if(!amount||amount<0){ toast('금액을 확인해 주세요'); return; }
  if(!paidOn){ toast('낸 날짜를 골라 주세요'); return; }
  const before=state.fines.filter(x=>x.type!=='waived').reduce((s,x)=>s+(+x.amount||0),0);
  anim.jar={from:before, fromLevel:before?Math.max(.1,Math.min(1,before/(OPIC_FEE*2))):0, person}; modal=null; anim.view='still';
  await store.addFine({person, amount, paidOn, memo:v('memo').trim(), type:'paid'});
  toast('저금통에 기록했어요', PCOLOR[person]);
}
// 드래그 앤 드롭 (데스크톱)
document.addEventListener('dragstart', ev=>{ const c=ev.target.closest?.('.chipx[draggable]'); if(!c||!editing) return; editing.sel={k:c.dataset.k,i:+c.dataset.i}; c.classList.add('dragging'); try{ ev.dataTransfer.setData('text/plain','x'); ev.dataTransfer.effectAllowed='move'; }catch(e){} });
document.addEventListener('dragend', ()=>document.querySelectorAll('.dragging,.drop').forEach(x=>x.classList.remove('dragging','drop')));
document.addEventListener('dragover', ev=>{ const col=ev.target.closest?.('.col'); if(!col||!editing) return; ev.preventDefault(); document.querySelectorAll('.col.drop').forEach(x=>x!==col&&x.classList.remove('drop')); col.classList.add('drop'); });
document.addEventListener('drop', ev=>{ const col=ev.target.closest?.('.col'); if(!col||!editing) return; ev.preventDefault(); moveTo(col.dataset.col); });
// 스와이프로 날짜 넘기기
let touch=null;
document.addEventListener('touchstart', ev=>{ if(tab!=='today'||ev.target.closest('.strip,.btn,a')) return; const p=ev.touches[0]; touch={x:p.clientX,y:p.clientY,t:Date.now()}; },{passive:true});
document.addEventListener('touchend', ev=>{ if(!touch) return; const p=ev.changedTouches[0], dx=p.clientX-touch.x, dy=p.clientY-touch.y; const ok=Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5&&Date.now()-touch.t<600; touch=null;
  if(ok){ const btn=document.querySelectorAll('.strip > .icon-btn')[dx>0?0:1]; if(btn&&!btn.disabled) btn.click(); } },{passive:true});
window.addEventListener('resize', ()=>afterRenderNav());
function afterRenderNav(){ const nav=document.querySelector('nav.tabs'), cur=nav?.querySelector('[aria-current="page"]'), pill=nav?.querySelector('.pill'); if(cur&&pill){ lastPill={x:cur.offsetLeft-5,w:cur.offsetWidth}; pill.style.transition='none'; pill.style.width=lastPill.w+'px'; pill.style.transform=`translateX(${lastPill.x}px)`; requestAnimationFrame(()=>pill.style.transition=''); } }

/* 상대가 체크하면 반짝 + 알림 */
function onData(){
  if(me){
    const o=OTHER[me], snap={};
    for(const [d,v] of Object.entries(state.days)) for(const [id,on] of Object.entries(v?.[o]||{})) if(on) snap[`${d}|${id}`]=true;
    if(prevPartner){
      const fresh=Object.keys(snap).filter(k=>!prevPartner[k]);
      if(fresh.length&&state.ready){
        anim.flash=fresh.map(k=>`${o}|${k}`);
        const [d,id]=fresh[fresh.length-1].split('|'); const it=itemsFor(d).find(i=>i.id===id);
        if(it) setTimeout(()=>toast(`${iga(PEOPLE[o].name)} '${it.title}' 끝냈어요`, PCOLOR[o]),200);
      }
    }
    prevPartner=snap;
  }
  if(editing||modal) return;
  const wait=holdUntil-Date.now();
  if(wait>0){ clearTimeout(holdTimer); holdTimer=setTimeout(()=>{ if(!editing&&!modal){ if(anim.view===null) anim.view='still'; render(); } },wait); return; }
  if(anim.view===null && !anim.jar) anim.view='still'; render();
}

/* =========================================================
   9) 시작
   ========================================================= */
(async ()=>{
  const p=new URLSearchParams(location.search);
  if(!firebaseConfig&&p.get('today')) simToday=p.get('today');
  if(p.get('me')){ me=p.get('me'); }
  if(p.get('tab')) tab=p.get('tab');
  render();
  try{ store = firebaseConfig ? await makeFirebaseStore(onData) : makeLocalStore(onData); }
  catch(e){ console.error(e); store=makeLocalStore(onData); toast('동기화 서버에 연결하지 못해 미리보기 모드로 열었어요'); }
})();
let lastDay=fmt(new Date());
setInterval(()=>{ const d=fmt(new Date()); if(d!==lastDay){ lastDay=d; if(!editing&&!modal){ anim.view='still'; render(); } } },60000);
</script>
